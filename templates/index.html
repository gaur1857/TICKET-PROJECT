<!DOCTYPE html>
<html>
<head>
    <title>Kreeva Ticket Tool</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    
    <style>
        body {
            font-family: Arial;
            margin: 0;
            background: #f4f6f9;
        }

        header {
            background: #2c3e50;
            color: white;
            padding: 15px;
            text-align: center;
            font-size: 24px;
        }

        .container {
            width: 90%;
            max-width: 600px;
            margin: 30px auto;
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }

        input, button {
            width: 100%;
            padding: 10px;
            margin-top: 10px;
        }

        button {
            background: #3498db;
            color: white;
            border: none;
            cursor: pointer;
        }

        button:hover {
            background: #2980b9;
        }

        .links {
            text-align: center;
            margin-top: 15px;
        }

        a {
            text-decoration: none;
            color: #3498db;
            margin: 0 10px;
        }
    </style>
</head>

<body>

<header>
    Kreeva Ticket Management System
</header>

<div class="container">
    <h2>Create Ticket</h2>

    <form action="/add" method="post">
        <input type="text" name="name" placeholder="Your Name" required>
        <input type="text" name="issue" placeholder="Describe Issue" required>
        <button type="submit">Submit Ticket</button>
    </form>

    <div class="links">
        <a href="/tickets">View Tickets</a> |
        <a href="/login">Login</a> |
        <a href="/signup">Signup</a>
    </div>
</div>

</body>
</html>
